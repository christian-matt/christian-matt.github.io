<!DOCTYPE html>
<html lang="{{ page.lang | default: 'de' }}">
{% include head.html %}
<body class="page-{{ page.nav_key }} card-style-{{ page.card_style | default: 'standard' }}">
  {% if page.redirect_to %}
  <main id="main-content" class="redirect-page">
    <p><a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_label | default: 'Continue' }}</a></p>
  </main>
  <script>window.location.replace({{ page.redirect_to | relative_url | jsonify }});</script>
  {% else %}
  {% include header.html %}
  <main id="main-content">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
