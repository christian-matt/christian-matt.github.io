{% assign nav = site.data.navigation[page.lang] %}
<footer class="site-footer">
  <div class="wrap">
    <a class="logo" href="{{ nav.home.url | relative_url }}">Christian Matt</a>
    <div class="footer-links">
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="{{ site.scholar }}" target="_blank" rel="noopener noreferrer">Google Scholar</a>
      <a href="{{ site.researchgate }}" target="_blank" rel="noopener noreferrer">ResearchGate</a>
      <a href="{{ nav.contact.url | relative_url }}">{{ nav.contact.label }}</a>
      <a href="{{ nav.legal.url | relative_url }}">Impressum</a>
    </div>
    <p class="footer-legal">2022 &ndash; {{ 'now' | date: '%Y' }} Prof. Dr. Christian Matt.</p>
  </div>
</footer>
